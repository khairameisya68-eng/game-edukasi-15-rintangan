<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misi Android Studio: 15 Rintangan</title>
<style>
:root{--bg:#12263A;--dk:#0b1620;--cd:#1c3a54;--ac:#F2B84B;--ok:#1F7A52;--bd:#B3261E;--ln:#5a7a98;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--dk);color:#fff;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--dk);font-size:15px}
#hd b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.hv{color:#ff8a80;letter-spacing:1px}
#mn{flex:1;overflow-y:auto;padding:14px 16px 24px;position:relative;-webkit-overflow-scrolling:touch}
#ft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--dk);font-size:14px}
#ft span{opacity:.8;text-align:center}
button{font:inherit;font-size:17px;cursor:pointer;min-height:48px;border-radius:10px;border:2px solid var(--ln);background:var(--cd);color:#fff;padding:8px 14px;text-align:left;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--ac)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button.ok:disabled,button.bad:disabled{opacity:1}
#hd button,#ft button{min-height:44px;font-size:15px;padding:6px 12px}
.pri,.sel{background:var(--ac)!important;color:#12263A!important;border-color:var(--ac)!important;font-weight:700;text-align:center}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.bad{background:var(--bd)!important;border-color:var(--bd)!important;color:#fff!important}
h1{font-size:clamp(34px,8vw,56px);margin:0 0 6px}
h2{font-size:clamp(22px,5vw,30px);margin:0 0 6px}
h3{font-size:19px;margin:0}
p{font-size:clamp(16px,2.4vw,20px);line-height:1.45;margin:0 0 10px}
ul{font-size:clamp(15px,2.2vw,18px);line-height:1.45;margin:0;padding-left:22px}li{margin-bottom:6px}
.ac{color:var(--ac)}.tag{color:var(--ac);font-weight:700;font-size:15px}
.card{background:var(--cd);border-radius:14px;padding:14px 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.mc{display:flex;flex-direction:column;gap:8px;justify-content:space-between}
#fb{min-height:52px;font-size:clamp(15px,2.2vw,19px);padding:12px 16px;border-radius:10px;background:var(--dk);margin:12px 0 8px}
#fb.ok{background:var(--ok)}#fb.bad{background:var(--bd)}
.slot{font-size:16px;padding:9px 0;border-bottom:1px solid #3d5c78}
.bar{display:flex;justify-content:space-between;font-size:17px;margin-bottom:8px}
.code{font-family:Consolas,Menlo,monospace;font-size:clamp(14px,2.2vw,19px);line-height:1.9;white-space:pre;overflow-x:auto;margin:8px 0}
.bl{display:inline-block;min-width:90px;padding:0 8px;border-radius:6px;text-align:center;background:var(--dk);border:1px dashed #8fb0cc}
.bl.y{background:var(--ac);color:#12263A}.bl.g{background:var(--ok)}
.ln{display:block;width:100%;min-height:44px;font-family:inherit;font-size:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;white-space:pre;text-align:left}
.ln i{opacity:.5;font-style:normal;margin-right:12px}
code{font-family:Consolas,monospace;background:var(--dk);padding:2px 6px;border-radius:6px;color:var(--ac)}
.n{font-size:16px}
.star{font-size:48px;color:var(--ac)}
.rs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 24px}
.rs div{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:6px 0;border-bottom:1px solid #3d5c78}
textarea{width:100%;height:80px;font:inherit;font-size:16px;border-radius:8px;border:2px solid var(--ln);padding:8px;background:#fff;color:#12263A}
.ovl{position:fixed;inset:0;background:rgba(11,22,32,.94);display:flex;align-items:center;justify-content:center;text-align:center;z-index:5;padding:20px}
@media(max-width:640px){.two{grid-template-columns:1fr}#hd b{display:none}.hv{flex:1}#ft span{font-size:12px}}
</style></head><body>
<div id="app"><div id="hd"></div><div id="mn"></div><div id="ft"></div></div>
<script>
const E=id=>document.getElementById(id),N=15;
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let ac,mute=false;
const S={scr:'cover',cur:0,done:[],sc:[],lv:[],m:[]};
function reset(){S.done=Array(N).fill(0);S.sc=Array(N).fill(0);S.lv=Array(N).fill(3);S.m=Array(N).fill(null)}reset();
const total=()=>S.sc.reduce((a,b)=>a+b,0);

/* ---------- data 15 rintangan ---------- */
const D=[['Bagian mana yang dipakai untuk membaca pesan error saat aplikasi berjalan?',['Project','Editor','Logcat'],2,'Logcat menampilkan log dan pesan error.'],
['Apa fungsi Device Manager?',['Mengelola perangkat virtual (emulator)','Menulis kode program','Membaca pesan error'],0,'Device Manager membuat dan mengelola emulator.'],
['File mana yang memuat daftar Activity dan izin aplikasi?',['strings.xml','build.gradle','AndroidManifest.xml'],2,'Manifest menyimpan identitas, Activity, dan izin aplikasi.'],
['Untuk apa Gradle sync dilakukan?',['Menghapus data emulator','Memuat ulang pengaturan build agar proyek sesuai','Mengganti versi Android di HP'],1,'Sync menyelaraskan proyek dengan pengaturan build.gradle.'],
['Minimum SDK menentukan apa?',['Versi Android terlama yang bisa menjalankan aplikasi','Ukuran layar aplikasi','Bahasa pemrograman yang dipakai'],0,'Perangkat dengan Android lebih lama tidak bisa memasang aplikasi.'],
['Di folder mana file layout tampilan layar disimpan?',['res/layout','manifests','Gradle Scripts'],0,'File XML tampilan layar berada di res/layout.'],
['Level Logcat mana yang paling tepat untuk mencari penyebab crash?',['Verbose','Info','Error'],2,'Filter Error menyaring pesan kegagalan.'],
['Package name aplikasi sebaiknya...',['Sama dengan aplikasi lain','Unik untuk tiap aplikasi','Dikosongkan'],1,'Package name adalah identitas unik aplikasi.']];
const L=[
{t:'Kenali Ruang Kerjamu',k:'match',d:'Pilih bagian jendela di kiri, lalu pilih fungsinya di kanan.',T:[['Run','Toolbar di atas berisi tombol Run.','Menjalankan aplikasi ke emulator atau HP'],['Project','Panel kiri menampilkan folder dan file.','Menampilkan struktur folder dan file proyek'],['Editor','Bagian tengah adalah area kerja utama.','Tempat menulis kode dan mengatur layout'],['Device Manager','Panel kanan mengelola perangkat virtual.','Membuat dan mengelola emulator'],['Logcat','Panel bawah memuat pesan sistem.','Menampilkan log dan pesan error']]},
{t:'Mulai Proyek',k:'order',d:'Tekan langkah sesuai urutan yang benar, dari yang paling awal.',O:[['Pilih New Project di layar Welcome','Proyek baru selalu dimulai dari sini.'],['Pilih template Empty Activity','Template menentukan kerangka awal aplikasi.'],['Isi nama aplikasi, package, bahasa, dan Minimum SDK','Identitas aplikasi harus jelas sebelum dibuat.'],['Klik Finish lalu tunggu Gradle sync selesai','Gradle menyusun proyek sebelum bisa dijalankan.'],['Pilih emulator di Device Manager','Aplikasi butuh perangkat tujuan untuk berjalan.'],['Klik tombol Run','Terakhir, jalankan dan lihat hasilnya.']]},
{t:'Rancang Layar Kasir',k:'match',d:'Pasangkan bagian layar kasir dengan komponen yang cocok.',T:[['Judul layar: teks Kasir Koperasi','Judul hanya menampilkan teks.','TextView'],['Kolom untuk mengetik harga barang','Pengguna harus bisa mengetik di sini.','EditText'],['Tombol untuk menghitung total','Pengguna menekan ini untuk menjalankan aksi.','Button'],['Tempat logo koperasi','Ini menampilkan gambar, bukan teks.','ImageView']]},
{t:'Hubungkan Kode',k:'fill',d:'Isi bagian kosong yang menyala kuning, dari atas ke bawah.',n:'Di layout: ID tombol adalah <code>btn_hitung</code>, ID kolom harga adalah <code>edit_harga</code>.',code:'val tombol = findViewById<Button>(R.id.{0})\ntombol.{1} { hitungTotal() }\nval harga = findViewById<EditText>(R.id.{2}).text.{3}()',A:['btn_hitung','setOnClickListener','edit_harga','toString'],W:['setOnClick','edit_harga','toString','btnHitung','setOnClickListener','toInt','btn_hitung','editHarga'],X:['ID harus sama persis dengan di layout.','Aksi klik dipasang dengan setOnClickListener.','Kolom harga memakai ID edit_harga.','Isi kolom diambil sebagai teks dengan toString().']},
{t:'Tiket Bug 1: Crash',k:'quiz',tm:90,d:'Klien melapor masalah. Putuskan tindakan yang tepat. Ada bonus waktu!',Q:[['Klien melapor: aplikasi langsung tertutup (crash) saat tombol Simpan ditekan. Apa langkah pertamamu?',['Buka Logcat, filter level Error, lalu cari baris exception','Instal ulang Android Studio','Ganti emulator dengan yang lebih besar'],0,'Logcat mencatat penyebab crash, jadi baca dulu sebelum mengubah apa pun.'],
['Logcat menunjuk error pada <code>findViewById(R.id.____)</code>. Di layout, ID tombolnya <code>btn_simpan</code>. Isian yang benar?',['btnSimpan','btn_simpan','Simpan'],1,'ID harus sama persis dengan di layout.'],
['Setelah menambah library di build.gradle, Gradle sync gagal dan tab Build penuh warna merah. Tindakan yang tepat?',['Hapus seluruh folder proyek','Abaikan error dan langsung klik Run','Baca pesan di tab Build, perbaiki dependensi, lalu klik Sync Now'],2,'Pesan di tab Build menunjuk dependensi yang bermasalah.']]},
{t:'Struktur Proyek',k:'match',d:'Cocokkan berkas atau folder dengan perannya.',T:[['AndroidManifest.xml','Berisi identitas aplikasi.','Mendaftarkan Activity dan izin aplikasi'],['res/layout','Folder berisi file XML.','Menyimpan file tampilan layar'],['strings.xml','Ada di res/values.','Menyimpan teks yang dipakai aplikasi'],['build.gradle','Ada di Gradle Scripts.','Mengatur dependensi dan versi SDK'],['MainActivity.kt','Berkas Kotlin.','Menulis logika layar utama']]},
{t:'Buat Emulator',k:'order',d:'Susun langkah membuat perangkat virtual dengan urutan benar.',O:[['Buka Device Manager','Semua perangkat virtual dikelola di sini.'],['Klik Create Device','Mulai membuat perangkat baru.'],['Pilih model perangkat, misalnya Pixel','Tentukan ukuran dan jenis layarnya.'],['Pilih system image Android lalu unduh','Perangkat butuh versi Android untuk dijalankan.'],['Klik Finish lalu tekan Play','Emulator siap dinyalakan.']]},
{t:'Atribut Layout XML',k:'fill',d:'Lengkapi XML tombol di bawah ini.',n:'Tombol harus punya ID, lebar mengikuti isinya, dan tulisan Hitung.',code:'<Button\n    android:{0}="@+id/btn_hitung"\n    android:layout_width="{1}"\n    android:{2}="Hitung" />',A:['id','wrap_content','text'],W:['text','match_parent','id','wrap_content','name','color'],X:['Atribut id memberi nama unik pada komponen.','wrap_content membuat lebar menyesuaikan isi.','Atribut text mengisi tulisan pada tombol.']},
{t:'Level Logcat',k:'match',d:'Pasangkan level Logcat dengan artinya.',T:[['Verbose','Paling lengkap dan paling ramai.','Semua pesan, paling rinci'],['Debug','Dipakai saat menguji.','Pesan untuk developer saat menguji'],['Info','Kejadian biasa.','Informasi umum kejadian normal'],['Warn','Tanda bahaya ringan.','Peringatan: ada potensi masalah'],['Error','Ada yang gagal.','Kegagalan, misalnya penyebab crash']]},
{t:'Tiket Bug 2: Pemasangan',k:'quiz',tm:60,d:'Tiga laporan baru dari klien. Waktu bonus berjalan!',Q:[['Aplikasi tidak bisa dipasang di HP klien yang Androidnya sangat lama. Apa yang dicek?',['Minimum SDK di build.gradle','Warna tombol','Nama emulator'],0,'Minimum SDK menentukan versi Android terlama yang didukung.'],
['Aplikasi crash saat membuka layar baru. Logcat: <code>ActivityNotFoundException</code>. Penyebab paling mungkin?',['Layar belum didaftarkan di AndroidManifest.xml','Teks terlalu panjang','Emulator kehabisan baterai'],0,'Setiap Activity harus terdaftar di manifest.'],
['Logcat: <code>Unresolved reference: Button</code>. Perbaikannya?',['Hapus file layout','Tambahkan import android.widget.Button','Ganti emulator'],1,'Kelas yang dipakai harus di-import.']]},
{t:'Pindah Layar',k:'fill',d:'Lengkapi kode untuk membuka DetailActivity.',n:'Pindah ke DetailActivity sambil membawa nilai total.',code:'val pindah = {0}(this, DetailActivity::class.java)\npindah.{1}("total", total)\n{2}(pindah)',A:['Intent','putExtra','startActivity'],W:['startActivity','getStringExtra','Intent','finish','putExtra','Bundle'],X:['Intent menyatakan tujuan perpindahan layar.','putExtra membawa data ke layar tujuan.','startActivity memulai layar tujuan.']},
{t:'Izin dan Keamanan',k:'quiz',d:'Tiga keputusan penting soal izin dan data pengguna.',Q:[['Aplikasimu perlu internet. Di mana izin INTERNET dideklarasikan?',['AndroidManifest.xml','strings.xml','activity_main.xml'],0,'Izin aplikasi dideklarasikan di AndroidManifest.xml.'],
['Aplikasi memakai kamera di Android modern. Selain di manifest, apa yang perlu dilakukan?',['Tidak perlu apa-apa','Meminta izin ke pengguna saat aplikasi berjalan','Menambah ukuran layar'],1,'Izin sensitif seperti kamera harus diminta saat runtime.'],
['Cara paling aman menyimpan kata sandi pengguna?',['Ditulis di kode sebagai teks biasa','Disimpan di strings.xml','Memakai penyimpanan terenkripsi'],2,'Data sensitif tidak boleh disimpan sebagai teks biasa.']]},
{t:'Cari Baris yang Salah',k:'bug',d:'Satu baris di tiap potongan kode mengandung kesalahan. Tekan baris itu.',Q:[[['val tombol = findViewById<Button>(R.id.btn_hitung)','tombol.setOnClickListener {','    val total = harga * jumlah','    teksTotal.text = total','}'],3,'Teks di TextView harus String. Ubah menjadi total.toString().'],
[['class MainActivity : AppCompatActivity() {','    override fun onCreate(savedInstanceState: Bundle?) {','        setContentView(R.layout.activity_main)','        super.onCreate(savedInstanceState)','    }'],2,'super.onCreate() harus dipanggil lebih dulu sebelum setContentView().'],
[['val daftar = listOf("Pensil", "Buku")','daftar.add("Penghapus")','println(daftar.size)'],1,'listOf membuat daftar yang tidak bisa diubah. Pakai mutableListOf untuk add.']]},
{t:'Rilis Aplikasi',k:'order',d:'Susun langkah membuat file aplikasi siap dibagikan.',O:[['Uji aplikasi di emulator sampai tidak ada bug','Jangan rilis sebelum diuji.'],['Buka menu Build lalu pilih Generate Signed Bundle / APK','Rilis dibuat dari menu Build.'],['Buat atau pilih keystore untuk tanda tangan','Aplikasi rilis harus ditandatangani.'],['Pilih build variant release lalu Finish','Varian release untuk pengguna sungguhan.'],['Kirim file hasil build ke klien','Terakhir, serahkan hasilnya.']]},
{t:'Demo ke Klien',k:'quiz',free:1,rand:5,d:'Kuis 5 soal acak untuk serah terima. Tidak ada pengurangan energi.',Q:D}
];
const mx=l=>100*(l.k=='match'?l.T.length:l.k=='order'?l.O.length:l.k=='fill'?l.A.length:l.k=='bug'?l.Q.length:(l.rand||l.Q.length));

/* ---------- inti ---------- */
function snd(ok){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=ok?'sine':'square';o.frequency.value=ok?660:200;g.gain.value=.07;o.start();o.stop(ac.currentTime+(ok?.15:.25))}catch(e){}}
function fb(t,c){const f=E('fb');if(f){f.textContent=t;f.className=c||'';f.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function stopT(){S.m.forEach(m=>{if(m&&m.iv){clearInterval(m.iv);m.iv=null}})}
function init(i){const l=L[i];let m={};
if(l.k=='match')m={sel:null,ok:[],ch:sh(l.T.map((_,j)=>j))};
else if(l.k=='order')m={n:0,ch:sh(l.O.map((_,j)=>j))};
else if(l.k=='fill')m={n:0};
else if(l.k=='bug')m={q:0,w:0};
else{const set=l.rand?sh(l.Q.map((_,j)=>j)).slice(0,l.rand):l.Q.map((_,j)=>j);m={q:0,w:0,set,t:l.tm||0,iv:null,o:sh(l.Q[set[0]][1].map((_,j)=>j))}}
S.m[i]=m}
function add(i,p){S.sc[i]+=p;snd(1);hud()}
function fin(i,msg,keep,cls){S.done[i]=1;stopT();hud();if(keep)fb(msg,cls||'ok');else draw(msg,cls||'ok');nav()}
function lose(i){S.lv[i]--;snd(0);hud();if(S.lv[i]<=0){stopT();const d=document.createElement('div');d.className='ovl';d.innerHTML='<div class="card"><h2>Energi habis</h2><p>Tenang, setiap developer pernah gagal build. Baca petunjuk dengan teliti lalu coba lagi.</p><button class="pri" data-a="rt">Ulangi rintangan</button></div>';E('mn').appendChild(d)}}
function nextBtn(a,t){E('mn').insertAdjacentHTML('beforeend','<button class="pri" style="width:100%" data-a="'+a+'">'+t+'</button>');E('mn').lastElementChild.scrollIntoView({block:'nearest',behavior:'smooth'})}
function draw(msg,cls){const x=E('mn').scrollTop;R.l();E('mn').scrollTop=x;if(msg)fb(msg,cls)}

/* ---------- tampilan per jenis ---------- */
const T={
match:(l,m)=>['<div class="two"><div class="col">'+l.T.map((t,j)=>{const d=m.ok.includes(j);return '<button data-a="mt" data-v="'+j+'" class="'+(d?'ok':m.sel===j?'sel':'')+'"'+(d?' disabled':'')+'>'+t[0]+'</button>'}).join('')+'</div><div class="col">'+m.ch.map(j=>{const d=m.ok.includes(j);return '<button data-a="mc" data-v="'+j+'"'+(d?' class="ok" disabled':'')+'>'+l.T[j][2]+'</button>'}).join('')+'</div></div>','Pilih satu bagian di kiri dulu.'],
order:(l,m)=>['<div class="two"><div class="col">'+m.ch.map(j=>'<button data-a="or" data-v="'+j+'"'+(j<m.n?' class="ok" disabled':'')+'>'+l.O[j][0]+'</button>').join('')+'</div><div class="card">'+l.O.map((s,i)=>'<div class="slot">'+(i+1)+'. '+(i<m.n?s[0]:'…')+'</div>').join('')+'</div></div>','Langkah apa yang paling pertama dilakukan?'],
fill:(l,m)=>{let c=l.code.replace(/</g,'&lt;');l.A.forEach((a,i)=>c=c.replace('{'+i+'}','<span class="bl'+(i<m.n?' g':i==m.n?' y':'')+'">'+(i<m.n?a:'____')+'</span>'));
return ['<p class="n">'+l.n+'</p><div class="card code">'+c+'</div><div class="wrap">'+l.W.map(w=>'<button data-a="fw" data-v="'+w+'">'+w+'</button>').join('')+'</div>','Pilih kata untuk bagian kosong yang menyala kuning.']},
quiz:(l,m)=>{const q=l.Q[m.set[m.q]],n=m.set.length;
return ['<div class="bar"><span>'+(l.tm?'Kasus ':'Soal ')+(m.q+1)+' dari '+n+'</span>'+(l.tm?'<span>Waktu bonus: <b id="tm">'+m.t+'</b> dtk</span>':'')+'</div><div class="card"><p style="margin:0">'+q[0]+'</p></div><div class="col" style="margin-top:10px">'+m.o.map(i=>'<button data-a="qo" data-v="'+i+'">'+q[1][i]+'</button>').join('')+'</div>','Pilih jawaban yang paling tepat.']},
bug:(l,m)=>['<div class="bar"><span>Potongan '+(m.q+1)+' dari '+l.Q.length+'</span></div><div class="card code" style="line-height:1.4">'+l.Q[m.q][0].map((s,i)=>'<button class="ln" data-a="bl" data-v="'+i+'"><i>'+(i+1)+'</i>'+s.replace(/</g,'&lt;')+'</button>').join('')+'</div>','Tekan baris yang mengandung kesalahan.']
};

const R={
cover(){E('mn').innerHTML='<div style="max-width:720px;margin:0 auto;padding-top:4vh"><div style="font-size:56px">📱</div><h1>Misi Android Studio</h1><h2 class="ac">Bangun Aplikasi Pertamamu: 15 Rintangan</h2><p>Studio Kodeku menerima proyek aplikasi kasir untuk koperasi sekolah. Jadilah developer junior: kenali alat kerjamu, rancang layar, hubungkan kode, bereskan bug, lalu serahkan ke klien.</p><div class="card" style="margin:12px 0 16px"><ul><li>15 rintangan, tiap rintangan punya 3 energi.</li><li>Jawaban benar +100. Jawaban salah mengurangi 1 energi.</li><li>Rintangan bertanda waktu memberi bonus jika cepat.</li><li>Pilih rintangan bebas lewat Menu.</li></ul></div><button class="pri" style="width:100%;font-size:20px" data-a="st">Mulai</button></div>'},
menu(){E('mn').innerHTML='<h2>Pilih rintangan</h2><p>Selesai '+S.done.filter(x=>x).length+' dari '+N+'. Boleh dimainkan tidak berurutan.</p><div class="grid">'+L.map((l,i)=>'<div class="card mc"><div><div class="tag">Rintangan '+(i+1)+(S.done[i]?' ✔ skor '+S.sc[i]:'')+'</div><h3>'+l.t+'</h3></div><button class="pri" data-a="g" data-v="'+i+'">'+(S.done[i]?'Main lagi':'Mainkan')+'</button></div>').join('')+'</div>'},
l(){const i=S.cur,l=L[i],m=S.m[i],r=T[l.k](l,m);
E('mn').innerHTML='<div class="tag">Rintangan '+(i+1)+' dari '+N+'</div><h2>'+l.t+'</h2><p>'+l.d+'</p>'+r[0]+'<div id="fb">'+r[1]+'</div>';
if(l.k=='quiz'&&l.tm&&!m.iv&&!S.done[i])m.iv=setInterval(()=>{if(m.t>0)m.t--;const x=E('tm');if(x)x.textContent=m.t},1000)},
result(){const t=total(),M=L.reduce((a,l)=>a+mx(l),0),p=Math.min(1,t/M),n=p>=.85?3:p>=.6?2:1,tt=['Calon developer, ayo coba lagi','Android Developer Junior','Android Developer Handal'][n-1];
let w=0,wr=9;L.forEach((l,i)=>{const r=S.sc[i]/mx(l);if(r<wr){wr=r;w=i}});
E('mn').innerHTML='<div class="card" style="text-align:center"><div class="star" aria-label="'+n+' bintang">'+'★'.repeat(n)+'☆'.repeat(3-n)+'</div><h2>'+tt+'</h2><p>Skor total: <b>'+t+'</b></p><p style="font-size:16px">Saran: ulangi Rintangan '+(w+1)+' ('+L[w].t+').</p><button class="pri" data-a="ag">Main lagi dari awal</button></div><div class="card" style="margin-top:12px"><h3 style="margin-bottom:6px">Ringkasan pencapaian</h3><div class="rs">'+L.map((l,i)=>'<div><span>'+(i+1)+'. '+l.t+'</span><b>'+S.sc[i]+'</b></div>').join('')+'</div></div><div class="card" style="margin-top:12px"><h3 style="margin-bottom:6px">Refleksi</h3><p style="font-size:16px">Jika klien melapor aplikasi crash, apa yang pertama kali kamu lakukan dan mengapa?</p><textarea aria-label="Jawaban refleksi"></textarea></div>'}
};

/* ---------- navigasi ---------- */
function hud(){const l=S.scr=='l'&&!L[S.cur].free;E('hd').style.display=S.scr=='cover'?'none':'flex';
E('hd').innerHTML='<b>Misi Android Studio</b>'+(l?'<span class="hv" aria-label="Energi">'+'♥'.repeat(Math.max(0,S.lv[S.cur]))+'♡'.repeat(Math.max(0,3-S.lv[S.cur]))+'</span>':'<span style="flex:1"></span>')+'<span>Skor '+total()+'</span><button id="mt" aria-label="Suara">'+(mute?'🔇':'🔊')+'</button><button id="mu">Menu</button>'}
function nav(){const s=S.scr,i=S.cur,all=S.done.every(x=>x),z=S.done.indexOf(0);let pv='menu',nx=null,ok=1,lb='Berikutnya',mid='';
E('ft').style.display=s=='cover'?'none':'flex';
if(s=='menu'){pv='cover';nx=all?['result']:['l',z];lb=all?'Lihat hasil':'Mulai main';mid='Menu'}
else if(s=='l'){ok=!!S.done[i];nx=i<N-1?['l',i+1]:(all?['result']:['menu']);if(i==N-1)lb=all?'Lihat hasil':'Ke menu';mid='Rintangan '+(i+1)+'/'+N}
else mid='Evaluasi';
E('ft').innerHTML='<button id="pv">Kembali</button><span>'+mid+'</span>'+(nx?'<button class="pri" id="nx"'+(ok?'':' disabled')+'>'+lb+'</button>':'<span style="width:90px"></span>');
E('pv').onclick=()=>go(pv);if(nx)E('nx').onclick=()=>nx[0]=='l'?A.g(nx[1]):go(nx[0])}
function go(s,i){stopT();S.scr=s;if(i!=null)S.cur=i;if(s=='l'&&!S.m[S.cur])init(S.cur);R[s]();E('mn').scrollTop=0;hud();nav()}

/* ---------- aksi ---------- */
const A={
st(){go('menu')},
g(v){const i=+v;if(S.done[i]){S.done[i]=0;S.sc[i]=0;S.lv[i]=3;S.m[i]=null}go('l',i)},
rt(){const i=S.cur;S.lv[i]=3;S.sc[i]=0;S.done[i]=0;S.m[i]=null;go('l',i)},
ag(){reset();go('menu')},
mt(v){S.m[S.cur].sel=+v;draw('Bagian dipilih. Sekarang pilih fungsinya.')},
mc(v){const i=S.cur,l=L[i],m=S.m[i];v=+v;if(m.sel==null)return fb('Pilih dulu salah satu bagian di kiri.','bad');
if(v==m.sel){const t=l.T[v];m.ok.push(v);m.sel=null;add(i,100);if(m.ok.length==l.T.length)fin(i,'Benar! Rintangan selesai. +100');else draw('Benar! '+t[0]+' cocok dengan fungsinya. +100','ok')}
else{const h=l.T[m.sel][1];draw('Belum tepat. Petunjuk: '+h,'bad');lose(i)}},
or(v){const i=S.cur,l=L[i],m=S.m[i];v=+v;
if(v==m.n){m.n++;add(i,100);if(m.n==l.O.length)fin(i,'Selesai! '+l.O[v][1]+' +100');else draw('Tepat! '+l.O[v][1]+' +100','ok')}
else{draw('Belum urutan itu. Tanyakan: apa yang harus siap sebelum langkah ini?','bad');lose(i)}},
fw(v){const i=S.cur,l=L[i],m=S.m[i];
if(v==l.A[m.n]){const k=m.n++;add(i,100);if(m.n==l.A.length)fin(i,'Selesai! '+l.X[k]+' +100');else draw('Tepat! '+l.X[k]+' +100','ok')}
else{draw('Belum tepat. Baca lagi petunjuk di atas kode.','bad');lose(i)}},
qo(v){const i=S.cur,l=L[i],m=S.m[i],q=l.Q[m.set[m.q]],bs=[...document.querySelectorAll('[data-a=qo]')],last=m.q==m.set.length-1;v=+v;
if(v==q[2]){const p=m.w?50:100;add(i,p);bs.forEach(b=>{b.disabled=true;if(+b.dataset.v==v)b.classList.add('ok')});
 if(last){let s=q[3]+' +'+p+'.';if(l.tm){const b=m.t*2;S.sc[i]+=b;s+=' Bonus waktu +'+b+'.'}fin(i,s+' Rintangan selesai!',1)}
 else{fb(q[3]+' +'+p,'ok');nextBtn('qn','Berikutnya')}}
else if(l.free){snd(0);bs.forEach(b=>{b.disabled=true;if(+b.dataset.v==q[2])b.classList.add('ok');else if(+b.dataset.v==v)b.classList.add('bad')});
 if(last)fin(i,'Belum tepat. '+q[3]+' Demo selesai!',1,'bad');else{fb('Belum tepat. '+q[3],'bad');nextBtn('qn','Berikutnya')}}
else{m.w=1;const b=bs.find(x=>+x.dataset.v==v);b.disabled=true;b.classList.add('bad');fb('Belum tepat. Pikirkan lagi sebelum bertindak. Coba pilihan lain.','bad');lose(i)}},
qn(){const i=S.cur,l=L[i],m=S.m[i];m.q++;m.w=0;m.o=sh(l.Q[m.set[m.q]][1].map((_,j)=>j));draw()},
bl(v){const i=S.cur,l=L[i],m=S.m[i],q=l.Q[m.q],bs=[...document.querySelectorAll('[data-a=bl]')],last=m.q==l.Q.length-1;v=+v;
if(v==q[1]){const p=m.w?50:100;add(i,p);bs.forEach(b=>b.disabled=true);bs[v].classList.add('ok');
 if(last)fin(i,q[2]+' +'+p+'. Rintangan selesai!',1);else{fb(q[2]+' +'+p,'ok');nextBtn('bn','Potongan berikutnya')}}
else{m.w=1;bs[v].disabled=true;bs[v].classList.add('bad');fb('Bukan baris itu. Baca ulang tiap baris dengan teliti.','bad');lose(i)}},
bn(){const m=S.m[S.cur];m.q++;m.w=0;draw()}
};
E('mn').onclick=e=>{const t=e.target.closest('[data-a]');if(t&&!t.disabled)A[t.dataset.a](t.dataset.v)};
E('hd').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='mt'){mute=!mute;hud()}if(b.id=='mu')go('menu')};
go('cover');
</script></body></html>
